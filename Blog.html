                    <h3>MHA: That Scalar Weight Thing and Why V Might Be Underrated</h3>

                    <div class="blog-toc">

                    <h4 id="mha-recap">Quick MHA Recap</h4>
                    <p>
                        Assuming you already have some idea about basic attention and MHA. Quick recap: you take your input sequence (with embedding dimension <code>d_model</code>), transform it using learned linear layers into Query (<code>Q</code>), Key (<code>K</code>), and Value (<code>V</code>) tensors. Mash Q and K together via a scaled dot product: <code>softmax(Q @ K^T / sqrt(d_k))</code> to get attention scores. Use those scores to create a weighted average of V, then run through an output linear layer.
                    </p>
                    <p>
                        The "Multi-Head" part: instead of one big calculation, you have <code>h</code> heads doing smaller calculations in parallel. After getting your main Q, K, V (all <code>d_model</code> deep), you reshape/split their embedding dimension into <code>h</code> chunks, each with dimension <code>d_k = d_model / h</code>. Each head runs attention separately on its chunk, then you concatenate and project back through <code>W_O</code>.
                    </p>

                    <h4 id="scalar-weight">The Scalar Weight Problem</h4>
                    <p>
                        Standard attention calculates <strong>one single scalar attention weight</strong> <code>a_ij</code> for each query-key pair. That single number then <strong>uniformly scales every element</strong> of the corresponding Value vector. The mechanism looks at Q_i and K_j, decides "V_j is 70% important overall," and multiplies the <em>whole thing</em> by 0.7. Every dimension gets the same blunt scaling factor.
                    </p>

                    <h4 id="pickier-attention">What If Attention Was Pickier?</h4>
                    <p>
                        Why not give a different weight to <strong>each dimension</strong> within the Value chunk, instead of applying a single scalar? It feels like that should give the model more freedom. Maybe the relationship between Q_i and K_j tells us that certain dimensions of V_j are highly relevant while others aren't needed for this specific query.
                    </p>

                    <h4 id="extreme-case">Extreme Case: <code>num_heads = d_model</code></h4>
                    <p>
                        What happens if you crank heads all the way up? Since <code>head_dim = d_model / num_heads</code>, setting <code>num_heads = d_model</code> gives <code>head_dim = 1</code>.
                    </p>
                    <ol>
                        <li>Each of the <code>d_model</code> heads operates on a single scalar from Q, K, and V.</li>
                        <li>Attention inside each head is just multiplying two scalars.</li>
                        <li>Each head outputs one scalar (a weighted sum of scalars).</li>
                        <li>Concatenating all heads reconstructs a <code>d_model</code> vector.</li>
                    </ol>
                    <p>
                        You get <code>d_model</code> parallel scalar-level attention calculations. It seems to give dimension-level control, but in an atomized way. Definitely not standard (where <code>d_k</code> is usually ~64), and the compute cost may not be worth it.
                    </p>

                    <h4 id="qkv-dimensions">Q, K, and V Don't Need the Same Dimension</h4>
                    <p>
                        Q and K <em>must</em> match in dimension (you can't compute <code>Q @ K^T</code> otherwise). But <strong>V can have a different dimension <code>d_v</code></strong>. The process:
                    </p>
                    <ol>
                        <li>Calculate scalar attention scores using Q (dim <code>d_k</code>) and K (dim <code>d_k</code>).</li>
                        <li>Weight V vectors (dim <code>d_v</code>) by those scores. Each head outputs dim <code>d_v</code>.</li>
                        <li>Concatenate all heads: dimension <code>h * d_v</code>.</li>
                        <li>Final projection <code>W_O</code> maps <code>h * d_v</code> back to <code>d_model</code>.</li>
                    </ol>
                    <p>
                        The comparison dimension (<code>d_k</code>) is separate from the information dimension (<code>d_v</code>). This flexibility is often glossed over.
                    </p>

                    <h4 id="value-stream">V Is Where the Action Is</h4>
                    <p>
                        While Q and K figure out <em>what</em> to focus on, <strong>V carries the actual content</strong> that gets aggregated and passed forward. Research has found performance improvements from manipulating the Value stream directly: adding value residuals from previous layers, applying activation functions to V before weighting, etc. The Value pathway seems like a high-leverage target for architectural improvements. But that's a whole other post.
                    </p>
